name: wdgc-supervision-evidence

services:
  mysql:
    image: mysql:8.0
    container_name: wdgc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wdgc_root_dev
      MYSQL_DATABASE: wdgc_supervision
      MYSQL_USER: wdgc_app
      MYSQL_PASSWORD: wdgc_app_dev
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - wdgc-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwdgc_app", "-pwdgc_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wdgc-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - wdgc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: wdgc-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mysql
      - redis
    profiles: ["with-nginx"]

volumes:
  wdgc-mysql-data:
    name: wdgc-mysql-data
  wdgc-redis-data:
    name: wdgc-redis-data
